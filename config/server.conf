# TinyWebServer 配置文件
# 注释以 # 开头

# ===================== 服务器配置 =====================
server.port = 8080 
# 监听端口
server.root_dir = ./www     
#网页文件根目录
server.max_connections = 1000   
# 最大并发连接数
server.backlog = 128    
# 等待队列长度
server.timeout = 30      
# 连接超时（秒）   

# ===================== 日志配置 =====================
log.level = INFO     
# 日志级别: DEBUG/INFO/WARNING/ERROR
log.file = logs/server.log  
#日志文件路径
log.max_size = 10485760            
# 日志文件最大大小（10MB）

#===================== 性能配置 =====================
performance.threads = 4    
# 工作线程数（稍后实现）
performance.cache_enabled = true 
# 是否启用缓存
preformance.cache_size = 100    
# 缓存大小（文件数）

# ===================== 安全配置 =====================
security.enable_access_log = true   
# 是否记录访问日志
security.allow_directory_listing = false  
# 是否允许目录浏览