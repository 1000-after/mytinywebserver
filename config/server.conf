# TinyWebServer 配置文件
# 注释以 # 开头

# ===================== 服务器配置 =====================
server.port = 8080 
# 监听端口
server.root_dir = ./www     
#网页文件根目录
server.max_connections = 1000   
# 最大并发连接数
server.backlog = 1024   
# 等待队列长度（listen backlog，原硬编码 1024，这里保持一致）
server.timeout = 15      
# 连接超时（秒）—— 必须和时间轮 SLOT_COUNT 一致（当前硬编码 15）  

# ===================== 日志配置 =====================
log.level = INFO     
# 日志级别: DEBUG/INFO/WARN/ERROR/FATAL
log.console_output = true
# 是否同时输出到控制台
log.file = ./logs/server.log  
#日志文件路径
log.max_size = 10485760            
# 日志文件最大大小（10MB）

#===================== 性能配置 =====================
performance.threads = 2    
# 工作线程数（匹配当前沙箱 2 vCPU，避免上下文切换开销）
performance.cache_enabled = true 
# 是否启用缓存
performance.cache_size = 100    
# 缓存大小（文件数）——原拼写 preformance 错误，已修正

# ===================== 安全配置 =====================
security.enable_access_log = true   
# 是否记录访问日志
security.allow_directory_listing = false  
# 是否允许目录浏览