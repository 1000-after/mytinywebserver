<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>403 - 禁止访问</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            /* 红色渐变背景，表示禁止/危险 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .error-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 50px;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .error-emoji { 
            font-size: 5rem; 
            margin-bottom: 20px; 
        }
        .error-code { 
            font-size: 6rem; 
            font-weight: 800; 
            color: #e74c3c;  /* 红色错误代码 */
            margin-bottom: 10px; 
        }
        .error-title { 
            font-size: 2rem; 
            margin: 20px 0; 
            color: #444; 
        }
        .error-message { 
            font-size: 1.1rem; 
            line-height: 1.6; 
            color: #666; 
            margin: 20px 0; 
        }
        ul {
            text-align: left;
            margin: 20px auto;
            max-width: 400px;
            color: #666;
        }
        li {
            margin: 10px 0;
            padding-left: 10px;
        }
        .action-buttons { 
            display: flex; 
            gap: 15px; 
            justify-content: center; 
            margin-top: 30px; 
        }
        .btn { 
            padding: 12px 30px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 600; 
            transition: all 0.3s; 
        }
        .btn-primary { 
            background: #e74c3c;  /* 红色按钮 */
            color: white; 
        }
        .btn-primary:hover { 
            background: #c0392b;  /* 深红色悬停 */
            transform: translateY(-3px); 
        }
        .btn-secondary { 
            background: #f8f9fa; 
            color: #495057; 
            border: 1px solid #dee2e6; 
        }
        .btn-secondary:hover { 
            background: #e9ecef; 
            transform: translateY(-3px); 
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-emoji">🚫</div>  <!-- 禁止符号 -->
        <h1 class="error-code">403</h1>
        <h2 class="error-title">禁止访问</h2>
        
        <p class="error-message">
            抱歉，您没有权限访问此页面。<br>
            这可能是因为：
        </p>
        
        <ul>
            <li>需要登录才能访问</li>
            <li>您的IP地址被限制</li>
            <li>访问了受保护的系统文件</li>
            <li>服务器配置限制</li>
        </ul>
        
        <div class="action-buttons">
            <a href="/" class="btn btn-primary">🏠 返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary">↩️ 返回上一页</a>
        </div>
    </div>
</body>
</html>
