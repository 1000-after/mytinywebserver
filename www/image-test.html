<!DOCTYPE html>
<!-- 补充：你漏了<html>标签，补上 -->
<html>
<head>
    <title>图片测试页面</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        .image-grid{
            display: grid;
            /* 修复：minmax(200px), 1fr → minmax(200px, 1fr) */
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .image-box{
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            background: white;
        }
        .image-box img{
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📸 图片文件测试</h1>
        <p>这个页面测试服务器是否能正确返回图片文件。</p>

        <div class="file-list">
            <h3>支持的图片格式：</h3>
            <div class="file-item">.jpg / .jpeg <span class="mime-badge">image/jpeg</span></div>
            <div class="file-item">.png <span class="mime-badge">image/png</span></div>
            <div class="file-item">.gif <span class="mime-badge">image/gif</span></div>
            <div class="file-item">.svg <span class="mime-badge">image/svg+xml</span></div>
        </div>        

        <h3>在线测试图片（来自网络）：</h3>
        <div class="image-grid">
            <div class="image-box">
                <p>JPG图片</p>
                <img src="https://via.placeholder.com/150x150/4CAF50/FFFFFF?text=JPG" alt="JPG测试">
            </div>
            <div class="image-box">
                <p>PNG图片</p>
                <img src="https://via.placeholder.com/150x150/2196F3/FFFFFF?text=PNG" alt="PNG测试">
            </div>
            <div class="image-box">
                <p>GIF图片</p>
                <img src="https://via.placeholder.com/150x150/FF9800/FFFFFF?text=GIF" alt="GIF测试">
            </div>
        </div>
        
        <div style="margin-top: 30px;">
            <a href="/" class="test-btn">🏠 返回首页</a>
            <a href="/test.html" class="test-btn">🔧 功能测试</a>
        </div>
    </div>
    
    <script src="/script.js"></script>
</body>
</html>
